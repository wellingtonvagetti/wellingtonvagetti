name: Gerar Pac-Man das contribuições

on:
  schedule:
    - cron: '0 9 * * *' # 06:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pacman.yml'

permissions:
  contents: read

concurrency:
  group: pacman-output
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'wellingtonvagetti/wellingtonvagetti'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Gerar SVGs claro e escuro
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa # v5.3.2
        with:
          github_user_name: wellingtonvagetti
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman

      - name: Validar os SVGs gerados
        shell: bash
        run: |
          test -s dist/pacman-contribution-graph.svg
          test -s dist/pacman-contribution-graph-dark.svg
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for name in ('pacman-contribution-graph.svg', 'pacman-contribution-graph-dark.svg'):
              assert ET.parse('dist/' + name).getroot().tag == '{http://www.w3.org/2000/svg}svg'
          PY

      - name: Publicar somente os SVGs na branch output
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd dist
          git init --initial-branch=output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pacman-contribution-graph.svg pacman-contribution-graph-dark.svg
          git commit -m 'chore: atualizar Pac-Man das contribuições'
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH_HEADER" push --force "https://github.com/$REPOSITORY.git" HEAD:refs/heads/output
